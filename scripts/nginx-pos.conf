# ==============================================================================
# Nginx Configuration Template - Qurais Kitchen POS & KDS
# Optimized for DigitalOcean VPS (Ubuntu 24.04 / 22.04 LTS)
# ==============================================================================

# Ganti 'pos.domainanda.com' dengan domain Staging atau Production Anda.
server {
    listen 80;
    listen [::]:80;
    server_name pos.domainanda.com;

    # Redirect seluruh HTTP ke HTTPS (akan diaktifkan otomatis oleh Certbot)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pos.domainanda.com;

    # SSL Configuration (Dikelola oleh Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/pos.domainanda.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/pos.domainanda.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Root direktori Laravel
    # Staging: /var/www/pos-staging/public
    # Production: /var/www/pos-production/public
    root /var/www/pos-production/public;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 64M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Log Files
    access_log /var/log/nginx/pos-access.log;
    error_log /var/log/nginx/pos-error.log error;

    # Entry point Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ==========================================================================
    # KONFIGURASI KHUSUS: Server-Sent Events (SSE) KDS Realtime (/api/kds/stream)
    # Mematikan buffering agar update pesanan langsung terdorong ke layar dapur
    # ==========================================================================
    location /api/kds/stream {
        try_files $uri $uri/ /index.php?$query_string;
        
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;

        # Disable FastCGI & Proxy Buffering untuk SSE Streaming
        fastcgi_buffering off;
        fastcgi_cache off;
        fastcgi_read_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    # Static Assets Caching (Vite build, images, fonts)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # PHP-FPM Handler
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # Proteksi File Sensitif (.env, .sqlite, .git, .htaccess)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ \.(sqlite|sqlite3|db|env|log)$ {
        deny all;
    }
}
