# ==============================================================================
# Supervisor Worker Configuration - Qurais Kitchen POS
# Path target VPS: /etc/supervisor/conf.d/pos-worker.conf
# ==============================================================================

[program:pos-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/pos-production/artisan queue:work database --sleep=3 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/pos-production/storage/logs/worker.log
stopwaitsecs=3600
